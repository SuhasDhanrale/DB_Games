        }

      const OPTION_LETTERS = ['A', 'B', 'C', 'D'];

      /* ============================================================
         STATE MANAGEMENT
         ============================================================ */
      const STORAGE_PREFIX = 'db-jam:v2:niti:';
      const DEFAULT_CARD_NAME = 'रमेश और परिवार';
      const USER_NAME_KEY = 'db_niti_user_name';
      const THEME_KEY = 'db_niti_active_theme';

      let currentDayId = 'd1';
      let selectedOptionId = null;
      let activeTheme = 'classic';
      let userName = '';

      try {
        userName = window.DBJamDemo.getItem(USER_NAME_KEY) || '';
        const savedTheme = window.DBJamDemo.getItem(THEME_KEY);
        if (savedTheme) activeTheme = savedTheme;
      } catch (e) {}

      function getStorageKey(dayId) {
        return STORAGE_PREFIX + dayId;
      }

      function loadStoredEdition(dayId) {
        try {
          const raw = window.DBJamDemo.getItem(getStorageKey(dayId));
          if (raw) return JSON.parse(raw);
        } catch (err) {}
        return null;
      }

      function saveStoredEdition(dayId, data) {
        try {
          window.DBJamDemo.setItem(getStorageKey(dayId), JSON.stringify(data));
        } catch (err) {}
      }

      function getInitialDayFromUrl() {
        return window.DBJamDemo.day;
      }

      /* ============================================================
         DOM ELEMENT REFS
         ============================================================ */
      const els = {
        stepAnswer: document.getElementById('step-answer'),
        stepCard: document.getElementById('step-card'),
        cardStage: document.getElementById('card-stage'),
        themeNameText: document.getElementById('theme-name-text'),
        thoughtCard: document.getElementById('thought-card'),
        thoughtContainer: document.getElementById('thought-text-container'),
        meaningRevealBox: document.getElementById('meaning-reveal-box'),
        meaningText: document.getElementById('meaning-text'),
        optionsGrid: document.getElementById('options-grid'),
        btnStep1Action: document.getElementById('btn-step1-action'),
        btnStep1Label: document.getElementById('btn-step1-label'),
        cardPreviewImg: document.getElementById('card-preview-img'),
        themeButtons: document.querySelectorAll('.theme-tab-btn'),
        cardUserNameInput: document.getElementById('card-user-name'),
        btnClearName: document.getElementById('btn-clear-name'),
        btnSharePrimary: document.getElementById('btn-share-primary'),
        btnGoHome: document.getElementById('btn-go-home'),
        shareCanvas: document.getElementById('shareCanvas'),
        toastPill: document.getElementById('toast-pill'),
        toastMsg: document.getElementById('toast-msg'),
        // Share Action Sheet Modal
        shareSheetBackdrop: document.getElementById('share-sheet-backdrop'),
        sheetBtnWhatsapp: document.getElementById('sheet-btn-whatsapp'),
        sheetBtnDownload: document.getElementById('sheet-btn-download'),
        sheetBtnCopy: document.getElementById('sheet-btn-copy'),
        sheetBtnCancel: document.getElementById('sheet-btn-cancel')
      };

      /* Toast Notification */
      let toastTimer = null;
      function showToast(msg) {
        if (!els.toastPill) return;
        els.toastMsg.textContent = msg;
        els.toastPill.classList.add('is-visible');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          els.toastPill.classList.remove('is-visible');
        }, 2200);
      }

      /* ============================================================
         SHARE ACTION SHEET (MODAL) CONTROLS
         ============================================================ */
      function openShareSheet() {
        if (!els.shareSheetBackdrop) return;
        els.shareSheetBackdrop.classList.add('is-open');
        els.shareSheetBackdrop.setAttribute('aria-hidden', 'false');
      }

      function closeShareSheet() {
        if (!els.shareSheetBackdrop) return;
        els.shareSheetBackdrop.classList.remove('is-open');
        els.shareSheetBackdrop.setAttribute('aria-hidden', 'true');
      }

      /* ============================================================
         STEP SWITCHING
         ============================================================ */
      function showStep(stepNum) {
        const stored = loadStoredEdition(currentDayId);
        if (stored?.confirmed) saveStoredEdition(currentDayId, { ...stored, view: stepNum === 2 ? 'card' : 'answer' });
        if (stepNum === 1) {
          els.stepAnswer.classList.add('is-active');
          els.stepCard.classList.remove('is-active');
        } else if (stepNum === 2) {
          els.stepAnswer.classList.remove('is-active');
          els.stepCard.classList.add('is-active');
          if (els.cardStage) {
            els.cardStage.setAttribute('data-active-theme', activeTheme);
          }
          generateShareCard();
        }
      }

      /* ============================================================
         RENDER STEP 1 (Answer View)
         ============================================================ */
      function renderStep1(celebrate = false) {
        const data = CONTENT[currentDayId];
        const saved = loadStoredEdition(currentDayId);
        const isConfirmed = !!(saved && saved.confirmed);
        const effectiveSelectedId = isConfirmed ? saved.selectedOption : selectedOptionId;
        els.thoughtCard.classList.toggle('is-result', isConfirmed);

        els.themeNameText.textContent = data.theme;

        // Render Thought with Interactive Blank Slot
        els.thoughtContainer.innerHTML = '';
        els.thoughtContainer.appendChild(document.createTextNode(data.blankPrefix));

        const blankSpan = document.createElement('span');
        blankSpan.id = 'thought-blank-slot';
        blankSpan.className = 'thought-blank-slot';

        if (isConfirmed) {
          const correctOpt = data.options.find(o => o.isCorrect);
          blankSpan.textContent = correctOpt ? correctOpt.text : '...';
          blankSpan.classList.add('is-correct');
        } else if (effectiveSelectedId) {
          const chosenOpt = data.options.find(o => o.id === effectiveSelectedId);
          blankSpan.textContent = chosenOpt ? chosenOpt.text : '';
          blankSpan.classList.add('is-preview');
        } else {
          blankSpan.textContent = '____';
          blankSpan.classList.add('is-empty');
        }
        els.thoughtContainer.appendChild(blankSpan);
        els.thoughtContainer.appendChild(document.createTextNode(data.blankSuffix));

        // Meaning Box
        if (isConfirmed) {
          els.meaningText.textContent = data.meaning;
          els.meaningRevealBox.classList.add('is-visible');
          window.DBResultCelebration.show(document.querySelector('[data-result-celebration]'), {
            game: 'niti', details: { correct: saved.isCorrect, selectedText: data.options.find(opt => opt.id === saved.selectedOption)?.text }, animate: celebrate,
          });
        } else {
          els.meaningRevealBox.classList.remove('is-visible');
          window.DBResultCelebration.clear(document.querySelector('[data-result-celebration]'));
        }

        // 2x2 Options Grid (A, B on top, C, D on bottom)
        els.optionsGrid.innerHTML = '';
        els.optionsGrid.hidden = isConfirmed;
        if (!isConfirmed) data.options.forEach((opt, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'opt-card-btn';
          btn.id = `opt-btn-${opt.id}`;
          btn.dataset.optId = opt.id;
          btn.setAttribute('role', 'radio');

          const letter = OPTION_LETTERS[index] || (index + 1);

          const badge = document.createElement('div');
          badge.className = 'opt-badge';
          badge.textContent = letter;

          const textWrap = document.createElement('div');
          textWrap.className = 'opt-text';
          textWrap.textContent = opt.text;

          btn.appendChild(badge);
          btn.appendChild(textWrap);

          const isSelected = opt.id === effectiveSelectedId;
          btn.classList.toggle('is-selected', isSelected);
          btn.setAttribute('aria-checked', String(isSelected));
          btn.addEventListener('click', () => {
            selectedOptionId = opt.id;
            saveStoredEdition(currentDayId, { confirmed: false, selectedOption: selectedOptionId });
            renderStep1();
          });

          els.optionsGrid.appendChild(btn);
        });

        // Bottom Action Button
        if (isConfirmed) {
          els.btnStep1Action.disabled = false;
          els.btnStep1Action.classList.add('is-goto-card');
          els.btnStep1Label.textContent = 'कार्ड बनाएं';
          els.btnStep1Action.querySelector('svg').style.display = 'none';
        } else {
          els.btnStep1Action.classList.remove('is-goto-card');
          els.btnStep1Label.textContent = 'उत्तर चुनें';
          els.btnStep1Action.querySelector('svg').style.display = 'inline-block';
          els.btnStep1Action.disabled = !effectiveSelectedId;
        }
      }

      function handleStep1Confirm() {
        const data = CONTENT[currentDayId];
        const saved = loadStoredEdition(currentDayId);

        if (saved && saved.confirmed) {
          showStep(2);
          return;
        }

        if (!selectedOptionId) return;

        const chosenOpt = data.options.find(o => o.id === selectedOptionId);
        const isCorrect = chosenOpt ? chosenOpt.isCorrect : false;

        saveStoredEdition(currentDayId, {
          confirmed: true,
          selectedOption: selectedOptionId,
          isCorrect: isCorrect,
          answeredAt: new Date().toISOString()
        });

        // Host reporting
        try {
          if (window.DBGameLab && typeof window.DBGameLab.reportScore === 'function') {
            window.DBGameLab.reportScore(isCorrect ? 10 : 5);
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'GAME_COMPLETE',
              gameId: 'niti',
              score: isCorrect ? 10 : 5,
              edition: currentDayId,
              details: { confirmed: true }
            }, '*');
          }
        } catch (e) {}

        renderStep1(true);
      }

      /* ============================================================
         TEXT WRAPPING UTILITY FOR CANVAS
         ============================================================ */
      function wrapTextLines(ctx, text, maxWidth) {
        const words = text.split(' ');
        const lines = [];
        let currentLine = '';

        for (let i = 0; i < words.length; i++) {
          const word = words[i];
          const testLine = currentLine ? (currentLine + ' ' + word) : word;
          const metrics = ctx.measureText(testLine);

          if (metrics.width > maxWidth && currentLine !== '') {
            lines.push(currentLine);
            currentLine = word;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);
        return lines;
      }

      /* ============================================================
         PROCEDURAL ARTWORK & DECORATIVE ILLUSTRATIONS
         ============================================================ */

      // 1. Draw Glowing Clay Diya
      function drawDiya(ctx, x, y, scale = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Radiant Golden Aura
        const glow = ctx.createRadialGradient(0, -22, 6, 0, -22, 75);
        glow.addColorStop(0, 'rgba(255, 235, 59, 0.95)');
        glow.addColorStop(0.35, 'rgba(255, 152, 0, 0.5)');
        glow.addColorStop(1, 'rgba(255, 152, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, -22, 75, 0, Math.PI * 2);
        ctx.fill();

        // Diya Flame (Inner white, middle gold, outer orange)
        ctx.beginPath();
        ctx.moveTo(0, -52);
        ctx.quadraticCurveTo(15, -25, 10, -5);
        ctx.quadraticCurveTo(0, 0, -10, -5);
        ctx.quadraticCurveTo(-15, -25, 0, -52);
        const flameGrad = ctx.createLinearGradient(0, -52, 0, 0);
        flameGrad.addColorStop(0, '#FFFFFF');
        flameGrad.addColorStop(0.3, '#FFF59D');
        flameGrad.addColorStop(0.7, '#FF9800');
        flameGrad.addColorStop(1, '#D84315');
        ctx.fillStyle = flameGrad;
        ctx.fill();

        // Blue inner flame core
        ctx.beginPath();
        ctx.ellipse(0, -4, 4, 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(66, 165, 245, 0.7)';
        ctx.fill();

        // Terracotta Diya Bowl
        ctx.beginPath();
        ctx.moveTo(-42, -5);
        ctx.quadraticCurveTo(-46, 28, 0, 30);
        ctx.quadraticCurveTo(46, 28, 42, -5);
        ctx.quadraticCurveTo(24, 3, 0, 3);
        ctx.quadraticCurveTo(-24, 3, -42, -5);
        const diyaGrad = ctx.createLinearGradient(0, -5, 0, 30);
        diyaGrad.addColorStop(0, '#E67E22');
        diyaGrad.addColorStop(0.5, '#D35400');
        diyaGrad.addColorStop(1, '#873600');
        ctx.fillStyle = diyaGrad;
        ctx.fill();

        // Golden Rim & Pearl Details
        ctx.strokeStyle = '#F1C40F';
        ctx.lineWidth = 2.8;
        ctx.stroke();

        ctx.fillStyle = '#F1C40F';
        [-26, -13, 0, 13, 26].forEach(dotX => {
          ctx.beginPath();
          ctx.arc(dotX, 14 - Math.abs(dotX) * 0.15, 2.8, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      // 2. Draw Crossed Festive Dandiya Sticks with Tassels (Large Scale)
      function drawCrossedDandiyas(ctx, x, y, scale = 1.8) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const drawStick = (angle) => {
          ctx.save();
          ctx.rotate((angle * Math.PI) / 180);

          // Stick body
          ctx.beginPath();
          ctx.roundRect(-8, -80, 16, 160, 8);
          const stickGrad = ctx.createLinearGradient(-8, 0, 8, 0);
          stickGrad.addColorStop(0, '#F39C12');
          stickGrad.addColorStop(0.5, '#F1C40F');
          stickGrad.addColorStop(1, '#D35400');
          ctx.fillStyle = stickGrad;
          ctx.fill();
          ctx.strokeStyle = '#B03A2E';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Wrapped colorful ribbon bands
          const bands = [-60, -38, -16, 6, 28, 50];
          bands.forEach((bY, idx) => {
            ctx.fillStyle = idx % 2 === 0 ? '#C0392B' : '#27AE60';
            ctx.fillRect(-8, bY, 16, 10);
            ctx.strokeStyle = '#F1C40F';
            ctx.lineWidth = 1.4;
            ctx.strokeRect(-8, bY, 16, 10);
          });

          // Golden bell at handle
          ctx.fillStyle = '#F1C40F';
          ctx.beginPath();
          ctx.arc(0, 88, 8, 0, Math.PI * 2);
          ctx.fill();

          // Tassel threads
          ctx.strokeStyle = '#E74C3C';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.moveTo(0, 96);
          ctx.lineTo(-7, 114);
          ctx.moveTo(0, 96);
          ctx.lineTo(7, 114);
          ctx.stroke();

          ctx.restore();
        };

        drawStick(-32);
        drawStick(32);

        // Center tie flower
        ctx.fillStyle = '#C0392B';
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#F1C40F';
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 3. Draw Grand Surya-Kamal (Sun & Lotus) Mandala Artwork for Classic Theme (Grand Scale)
      function drawSuryaKamalMedallion(ctx, cx, cy, radius = 110) {
        ctx.save();
        ctx.translate(cx, cy);

        // Ambient radiant halo
        const haloGrad = ctx.createRadialGradient(0, 0, 15, 0, 0, radius * 1.35);
        haloGrad.addColorStop(0, 'rgba(243, 156, 18, 0.28)');
        haloGrad.addColorStop(0.55, 'rgba(226, 58, 40, 0.1)');
        haloGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.35, 0, Math.PI * 2);
        ctx.fill();

        // 16 Radiant Triangular Sun Rays
        ctx.fillStyle = '#E23A28';
        for (let i = 0; i < 16; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI) / 8);
          ctx.beginPath();
          ctx.moveTo(0, -radius * 0.72);
          ctx.lineTo(9, -radius);
          ctx.lineTo(-9, -radius);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Inner Sun Circle
        ctx.fillStyle = '#F39C12';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#D35400';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // 12 Delicate Lotus Petals
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2.6;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        for (let j = 0; j < 12; j++) {
          ctx.save();
          ctx.rotate((j * Math.PI) / 6);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(18, -radius * 0.38, 0, -radius * 0.65);
          ctx.quadraticCurveTo(-18, -radius * 0.38, 0, 0);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // Center Golden Bindu & Core
        ctx.fillStyle = '#E23A28';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F1C40F';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#F1C40F';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.1, 0, Math.PI * 2);
        ctx.fill();

        // Flanking graceful ornamental leafy vines
        const drawVine = (direction) => {
          ctx.save();
          ctx.scale(direction, 1);
          ctx.strokeStyle = '#D35400';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(radius * 1.05, 0);
          ctx.quadraticCurveTo(radius * 1.55, -24, radius * 2.2, 0);
          ctx.stroke();

          // Leaf florets
          [-15, 12].forEach(offsetY => {
            ctx.fillStyle = '#E23A28';
            ctx.beginPath();
            ctx.ellipse(radius * 1.65, offsetY, 10, 5, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        };

        drawVine(1);
        drawVine(-1);

        ctx.restore();
      }

      // 4. Draw Traditional Gujarati Checkered Bandhani Border
      function drawCheckeredBorder(ctx, width, height, inset, thickness) {
        ctx.save();
        const colors = ['#C0392B', '#F1C40F', '#27AE60', '#E67E22'];
        const size = thickness;

        const countX = Math.floor((width - inset * 2) / size);
        for (let i = 0; i < countX; i++) {
          ctx.fillStyle = colors[i % colors.length];
          ctx.fillRect(inset + i * size, inset, size, size);
          ctx.fillStyle = colors[(i + 2) % colors.length];
          ctx.fillRect(inset + i * size, height - inset - size, size, size);
        }

        const countY = Math.floor((height - inset * 2) / size);
        for (let j = 0; j < countY; j++) {
          ctx.fillStyle = colors[(j + 1) % colors.length];
          ctx.fillRect(inset, inset + j * size, size, size);
          ctx.fillStyle = colors[(j + 3) % colors.length];
          ctx.fillRect(width - inset - size, inset + j * size, size, size);
        }

        ctx.restore();
      }

      /* ============================================================
         SHARE CARD: fixed safe regions keep text, artwork and footer apart.
         The thought leads; its meaning uses smaller type in a separate region.
         ============================================================ */
      let cardRenderVersion = 0;

      function fitCardText(ctx, text, maxWidth, maxHeight, initialSize, weight = 600) {
        let fontSize = initialSize;
        let lines;
        let lineHeight;
        do {
          ctx.font = weight + ' ' + fontSize + 'px "Noto Sans Devanagari", "Nirmala UI", sans-serif';
          lines = wrapTextLines(ctx, text, maxWidth);
          lineHeight = fontSize * 1.55;
          if (lines.length * lineHeight <= maxHeight &&
              lines.every(line => ctx.measureText(line).width <= maxWidth)) break;
          fontSize -= 1;
        } while (fontSize > 12);
        return { lines, lineHeight };
      }

      async function generateShareCard() {
        const canvas = els.shareCanvas;
        if (!canvas) return;
        const renderVersion = ++cardRenderVersion;

        // Explicitly load the font used by the canvas, including on an early visit.
        if (document.fonts) {
          try {
            await document.fonts.load('600 72px "Noto Sans Devanagari"');
            await document.fonts.load('500 36px "Noto Sans Devanagari"');
            await document.fonts.load('700 56px "Noto Sans Devanagari"');
            await document.fonts.ready;
          } catch (e) {}
        }
        if (renderVersion !== cardRenderVersion) return;

        const ctx = canvas.getContext('2d');
        const data = CONTENT[currentDayId];
        const familyName = userName.trim() || DEFAULT_CARD_NAME;
        const width = 1080;
        const height = 1350;
        const centerX = width / 2;
        const contentWidth = 820;
        const palettes = {
          classic: { background: ['#FCF8F0', '#F2E8DA'], ink: '#382A20', accent: '#B95435', muted: '#806B58', border: '#D8B893', heading: 'आज की नीति' },
          navratri: { background: ['#FFF9F0', '#FBE5CB'], ink: '#522C25', accent: '#AB3E32', muted: '#946F55', border: '#D6A065', heading: 'शुभ नवरात्रि' },
          diwali: { background: ['#2B1738', '#140C21'], ink: '#FFF5DE', accent: '#EAC376', muted: '#C1ABC9', border: '#997348', heading: 'शुभ दीपावली' }
        };
        const palette = palettes[activeTheme] || palettes.classic;

        ctx.clearRect(0, 0, width, height);
        const background = ctx.createLinearGradient(0, 0, width, height);
        palette.background.forEach((color, index) => background.addColorStop(index, color));
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, width, height);

        // Quiet outer detail; decoration never runs behind the text.
        ctx.strokeStyle = palette.border;
        ctx.lineWidth = 2;
        ctx.strokeRect(48, 48, width - 96, height - 96);
        if (activeTheme === 'navratri') {
          drawCheckeredBorder(ctx, width, height, 28, 10);
        }
        if (activeTheme === 'diwali') {
          ctx.fillStyle = palette.accent;
          [[100, 130, 3], [980, 130, 3], [145, 235, 2], [935, 235, 2]].forEach(([x, y, radius]) => {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = palette.accent;
        ctx.font = '700 56px "Noto Sans Devanagari", "Nirmala UI", sans-serif';
        ctx.fillText(palette.heading, centerX, 190);
        ctx.strokeStyle = palette.border;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX - 45, 240);
        ctx.lineTo(centerX + 45, 240);
        ctx.stroke();

        // Fit the complete thought into its own region, without truncating it.
        const thought = fitCardText(ctx, data.fullThought, contentWidth, 310, 64);
        ctx.fillStyle = palette.ink;
        ctx.textBaseline = 'middle';
        const firstLineY = 415 - ((thought.lines.length - 1) * thought.lineHeight) / 2;
        thought.lines.forEach((line, index) => {
          ctx.fillText(line, centerX, firstLineY + index * thought.lineHeight);
        });

        // Keep the complete meaning, with quieter typography and no heavy plaque.
        ctx.strokeStyle = palette.border;
        ctx.beginPath();
        ctx.moveTo(centerX - 130, 585);
        ctx.lineTo(centerX + 130, 585);
        ctx.stroke();
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = palette.accent;
        ctx.font = '600 27px "Noto Sans Devanagari", "Nirmala UI", sans-serif';
        ctx.fillText('अर्थ', centerX, 640);
        const meaning = fitCardText(ctx, data.meaning, contentWidth - 40, 180, 36, 500);
        ctx.fillStyle = palette.ink;
        ctx.textBaseline = 'middle';
        const firstMeaningY = 740 - ((meaning.lines.length - 1) * meaning.lineHeight) / 2;
        meaning.lines.forEach((line, index) => {
          ctx.fillText(line, centerX, firstMeaningY + index * meaning.lineHeight);
        });

        // A single motif per theme, with generous space above the signature.
        if (activeTheme === 'diwali') {
          drawDiya(ctx, centerX, 950, 1.15);
        } else if (activeTheme === 'navratri') {
          drawCrossedDandiyas(ctx, centerX, 945, 0.72);
        } else {
          drawSuryaKamalMedallion(ctx, centerX, 945, 46);
        }

        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = palette.muted;
        ctx.font = '500 27px "Noto Sans Devanagari", "Nirmala UI", sans-serif';
        ctx.fillText('सप्रेम', centerX, 1050);
        const signature = fitCardText(ctx, familyName, contentWidth, 95, 42, 700);
        ctx.fillStyle = palette.ink;
        ctx.textBaseline = 'middle';
        const signatureY = 1110 - ((signature.lines.length - 1) * signature.lineHeight) / 2;
        signature.lines.forEach((line, index) => {
          ctx.fillText(line, centerX, signatureY + index * signature.lineHeight);
        });

        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = palette.muted;
        ctx.font = '500 22px "Noto Sans Devanagari", "Nirmala UI", sans-serif';
        ctx.fillText('मौलिक विचार · डेमो के लिए लिखा गया', centerX, 1200);
        ctx.fillStyle = palette.accent;
        ctx.font = '600 25px "Noto Sans Devanagari", "Nirmala UI", sans-serif';
        ctx.fillText('Dainik Bhaskar / दैनिक भास्कर', centerX, 1250, width - 160);

        // Update in-page preview image
        try {
          const dataUrl = canvas.toDataURL('image/png');
          if (els.cardPreviewImg) {
            els.cardPreviewImg.src = dataUrl;
          }
        } catch (err) {}
      }

      /* ============================================================
         DOWNLOAD & SHARE ACTIONS
         ============================================================ */
      function downloadCard() {
        const canvas = els.shareCanvas;
        if (!canvas) return;
        const data = CONTENT[currentDayId];
        const filename = `aaj-ki-niti-${data.id}-${activeTheme}.png`;

        try {
          if (canvas.toBlob) {
            canvas.toBlob(blob => {
              if (!blob) {
                fallbackDownload(canvas.toDataURL('image/png'), filename);
                return;
              }
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = filename;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 2000);
              showToast('कार्ड डाउनलोड हो गया!');
            }, 'image/png');
          } else {
            fallbackDownload(canvas.toDataURL('image/png'), filename);
          }
        } catch (e) {
          fallbackDownload(canvas.toDataURL('image/png'), filename);
        }
      }

      function fallbackDownload(dataUrl, filename) {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('कार्ड डाउनलोड हो गया!');
      }

      function getFormattedShareText(data) {
        const familyName = userName.trim() || DEFAULT_CARD_NAME;
        let festGreeting = '';
        if (activeTheme === 'diwali') {
          festGreeting = `🪔 शुभ दीपावली — ${familyName} 🪔\n\n`;
        } else if (activeTheme === 'navratri') {
          festGreeting = `🌸 शुभ नवरात्रि — ${familyName} 🌸\n\n`;
        } else {
          festGreeting = `🌸 आज की नीति — सप्रेम प्रेषक: ${familyName} 🌸\n\n`;
        }
        return `${festGreeting}${data.fullThought}\n\nअर्थ: ${data.meaning}\n\nमौलिक विचार · डेमो के लिए लिखा गया\nDainik Bhaskar / दैनिक भास्कर`;
      }

      async function handleShareAction() {
        const data = CONTENT[currentDayId];
        const canvas = els.shareCanvas;

        if (navigator.share && navigator.canShare && canvas && canvas.toBlob) {
          try {
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (blob) {
              const file = new File([blob], `aaj-ki-niti-${data.id}-${activeTheme}.png`, { type: 'image/png' });
              const shareData = {
                title: `आज की नीति · ${data.theme}`,
                text: getFormattedShareText(data),
                files: [file]
              };

              if (navigator.canShare(shareData)) {
                await navigator.share(shareData);
                showToast('कार्ड साझा किया गया!');
                return;
              }
            }
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        downloadCard();
        copyThoughtToClipboard();
      }

      async function copyThoughtToClipboard() {
        const data = CONTENT[currentDayId];
        const shareText = getFormattedShareText(data);

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(shareText);
            showToast('विचार टेक्स्ट कॉपी हो गया!');
            return;
          }
        } catch (err) {}

        window.prompt('विचार टेक्स्ट कॉपी करें (Ctrl+C):', shareText);
      }

      /* Navigation Actions: Home */
      function navigateHome() {
        window.DBGameNavigation.goHome();
      }

      /* ============================================================
         EVENT LISTENERS & BINDINGS
         ============================================================ */
      function initEventListeners() {
        // Step 1 Confirm Action
        els.btnStep1Action.addEventListener('click', handleStep1Confirm);

        // 3 Theme Tabs (Above Card): सामान्य, नवरात्रि, दिवाली
        els.themeButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            const themeKey = btn.dataset.theme;
            activeTheme = themeKey;
            try { window.DBJamDemo.setItem(THEME_KEY, activeTheme); } catch (e) {}

            els.themeButtons.forEach(b => b.classList.toggle('is-active', b === btn));
            if (els.cardStage) {
              els.cardStage.setAttribute('data-active-theme', activeTheme);
            }
            generateShareCard();
            const labelText = btn.querySelector('span:last-child')?.textContent?.trim() || btn.textContent.trim();
            showToast(`थीम: ${labelText}`);
          });
        });

        // User Name Input (Real-time card re-rendering)
        if (els.cardUserNameInput) {
          els.cardUserNameInput.value = userName;
          if (userName.trim()) els.btnClearName.style.display = 'inline-block';

          let nameDebounceTimer = null;
          els.cardUserNameInput.addEventListener('input', (e) => {
            userName = e.target.value;
            els.btnClearName.style.display = userName.trim() ? 'inline-block' : 'none';

            try { window.DBJamDemo.setItem(USER_NAME_KEY, userName); } catch (err) {}

            if (nameDebounceTimer) clearTimeout(nameDebounceTimer);
            nameDebounceTimer = setTimeout(() => {
              generateShareCard();
            }, 100);
          });

          els.btnClearName.addEventListener('click', () => {
            userName = '';
            els.cardUserNameInput.value = '';
            els.btnClearName.style.display = 'none';
            try { window.DBJamDemo.removeItem(USER_NAME_KEY); } catch (e) {}
            generateShareCard();
          });
        }

        // Primary Hero Share CTA: opens share modal sheet
        if (els.btnSharePrimary) {
          els.btnSharePrimary.addEventListener('click', openShareSheet);
        }

        // Inside Share Modal Sheet:
        if (els.sheetBtnWhatsapp) {
          els.sheetBtnWhatsapp.addEventListener('click', () => {
            closeShareSheet();
            handleShareAction();
          });
        }

        if (els.sheetBtnDownload) {
          els.sheetBtnDownload.addEventListener('click', () => {
            closeShareSheet();
            downloadCard();
          });
        }

        if (els.sheetBtnCopy) {
          els.sheetBtnCopy.addEventListener('click', () => {
            closeShareSheet();
            copyThoughtToClipboard();
          });
        }

        if (els.sheetBtnCancel) {
          els.sheetBtnCancel.addEventListener('click', closeShareSheet);
        }

        if (els.shareSheetBackdrop) {
          els.shareSheetBackdrop.addEventListener('click', (e) => {
            if (e.target === els.shareSheetBackdrop) {
              closeShareSheet();
            }
          });
        }

        // Navigation (Home)
        els.btnGoHome.addEventListener('click', navigateHome);
      }

      /* ============================================================
         INITIALIZATION
         ============================================================ */
      async function init() {
        await window.gameIntroReady;
        currentDayId = getInitialDayFromUrl();
        selectedOptionId = loadStoredEdition(currentDayId)?.selectedOption || null;
        initEventListeners();

        // Restore active theme tab
        els.themeButtons.forEach(btn => {
          btn.classList.toggle('is-active', btn.dataset.theme === activeTheme);
        });

        if (els.cardStage) {
          els.cardStage.setAttribute('data-active-theme', activeTheme);
        }

        renderStep1();

        const saved = loadStoredEdition(currentDayId);
        if (saved && saved.confirmed) {
          showStep(saved.view === 'card' ? 2 : 1);
        } else {
          showStep(1);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
