;min-height:42px;font-family:inherit;font-size:15px;font-weight:700;transition:all .16s;display:flex;box-shadow:0 4px 14px #e23a2847}.btn-share-hero:hover{transform:translateY(-1px);box-shadow:0 6px 18px #e23a2859}.dock-actions-row{grid-template-columns:1fr 1.35fr;gap:6px;display:grid}.btn-dock-action{background:var(--color-surface-soft);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);min-height:32px;color:var(--text-muted);cursor:pointer;justify-content:center;align-items:center;gap:5px;font-family:inherit;font-size:12px;font-weight:700;text-decoration:none;transition:all .15s;display:flex}.btn-dock-action:hover{color:var(--text-main);border-color:var(--border-medium);background:#fff}.btn-dock-action.is-next-pill{background:var(--color-primary-light);color:var(--color-primary);border-color:#e23a284d}.btn-dock-action.is-next-pill:hover{background:var(--color-primary);color:#fff}.share-sheet-backdrop{backdrop-filter:blur(4px);z-index:1500;opacity:0;pointer-events:none;background:#0000008c;flex-direction:column;justify-content:flex-end;transition:opacity .22s;display:flex;position:fixed;inset:0}.share-sheet-backdrop.is-open{opacity:1;pointer-events:auto}.share-sheet-modal{background:#fff;border-radius:20px 20px 0 0;flex-direction:column;gap:12px;width:100%;max-width:480px;margin:0 auto;padding:12px 16px 20px;transition:transform .26s cubic-bezier(.16,1,.3,1);display:flex;transform:translateY(100%);box-shadow:0 -8px 32px #00000040}.share-sheet-backdrop.is-open .share-sheet-modal{transform:translateY(0)}.share-sheet-handle{background:#d8d8d8;border-radius:3px;align-self:center;width:38px;height:4.5px;margin-bottom:2px}.share-sheet-header{text-align:center}.share-sheet-title{color:var(--text-main);font-size:16px;font-weight:800}.share-sheet-subtitle{color:var(--text-muted);margin-top:2px;font-size:12px}.share-sheet-options{flex-direction:column;gap:8px;display:flex}.share-opt-row{border:1.5px solid var(--border-subtle);border-radius:var(--radius-md); <body>

  <!-- Top Accent Bar -->
  <div class="top-accent-bar" aria-hidden="true"></div>

  <!-- Main Mobile-First Shell -->
  <main class="app-container" id="app">

    <!-- ============================================================
         STEP 1: ANSWER VIEW (First Step)
         ============================================================ -->
    <div class="step-view is-active" id="step-answer">
      
      <div class="step1-content-wrap">
        <!-- Minimal Tag Pill -->
        <div class="thought-category-pill" id="thought-category-pill">
          <span>✨ आज का विचार · <span id="theme-name-text">समझ</span></span>
        </div>

        <!-- Central Thought Card -->
        <article class="thought-card" id="thought-card" aria-label="आज का विचार">
          <span class="thought-quote-mark" aria-hidden="true">“</span>
          
          <p class="thought-content" id="thought-text-container">
            <!-- Rendered dynamically with live interactive blank -->
          </p>

          <div class="thought-card-footer">
            <span>दैनिक भास्कर खेल</span>
          </div>
        </article>

        <!-- Meaning Box: Revealed after answering -->
        <div class="meaning-reveal-box" id="meaning-reveal-box" aria-live="polite">
          <div class="meaning-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span>विचार का अर्थ</span>
          </div>
          <p class="meaning-text" id="meaning-text">
            <!-- Populated from CONTENT -->
          </p>
        </div>

        <!-- 4 Options in 2x2 Grid (A, B on top, C, D on bottom) -->
        <div class="options-grid" id="options-grid" role="radiogroup" aria-label="चार विकल्प">
          <!-- Rendered dynamically as 2x2 grid -->
        </div>
      </div>

      <!-- Bottom Action Bar -->
      <div class="step-bottom-bar">
        <button type="button" class="btn-main-action" id="btn-step1-action" disabled>
          <span id="btn-step1-label">उत्तर चुनें</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>

    </div>

    <!-- ============================================================
         STEP 2: CARD STUDIO (Theme Tabs Above Card + Responsive Frame)
         ============================================================ */ -->
    <div class="step-view" id="step-card">
      <div class="step2-layout">

        <!-- 1. Top Theme Switcher Bar (Placed directly above the card) -->
        <div class="theme-segmented-bar" id="theme-selector-row" role="radiogroup" aria-label="कार्ड थीम">
          <button type="button" class="theme-tab-btn is-active" data-theme="classic" aria-label="सामान्य कार्ड">
            <span class="theme-dot" aria-hidden="true"></span>
            <span>🗞️ सामान्य</span>
          </button>
          <button type="button" class="theme-tab-btn" data-theme="navratri" aria-label="नवरात्रि कार्ड">
            <span class="theme-dot" aria-hidden="true"></span>
            <span>🌸 नवरात्रि</span>
          </button>
          <button type="button" class="theme-tab-btn" data-theme="diwali" aria-label="दिवाली कार्ड">
            <span class="theme-dot" aria-hidden="true"></span>
            <span>🪔 दिवाली</span>
          </button>
        </div>

        <!-- 2. Center Card Showcase Stage (Adapts to all phone dimensions) -->
        <div class="card-stage" id="card-stage" data-active-theme="classic">
          <div class="card-preview-frame">
            <img id="card-preview-img" class="card-preview-img" src="" alt="विचार कार्ड पूर्वावलोकन">

            <!-- Top-Right Corner Floating Share Button -->
            <button type="button" class="card-quick-share-btn" id="btn-corner-share" title="कार्ड साझा करें" aria-label="कार्ड साझा करें">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- 3. Bottom Compact Studio Dock: Name Input + Share CTA + Nav -->
        <div class="card-studio-dock">
          
          <!-- Name Personalization Input -->
          <div class="name-input-bar">

  <!-- JavaScript Logic -->
  <script>
    (function () {
      'use strict';

      /* ============================================================
         CONTENT DEFINITIONS (3 Days / Editions)
         ============================================================ */
      const CONTENT = {
        d1: {
          id: 'd1',
          dayNum: 1,
          theme: 'समझ',
          nextDayId: 'd2',
          nextLabel: 'अगला विचार (संस्करण 2) →',
          incomplete: 'किसी को समझने की शुरुआत, अपनी बात कहने से पहले ____ से होती है।',
          blankPrefix: 'किसी को समझने की शुरुआत, अपनी बात कहने से पहले ',
          blankSuffix: ' से होती है।',
          options: [
            { id: 'opt_1_1', text: 'उसकी बात सुनने', isCorrect: true },
            { id: 'opt_1_2', text: 'अपनी राय बनाने', isCorrect: false },
            { id: 'opt_1_3', text: 'तुरंत सलाह देने', isCorrect: false },
            { id: 'opt_1_4', text: 'विषय बदलने', isCorrect: false }
          ],

          meaning: 'ध्यान से सुनने पर हमें दूसरे व्यक्ति का अनुभव और नज़रिया समझने का अवसर मिलता है।'
        },
        d2: {
          id: 'd2',
          dayNum: 2,
          theme: 'अभ्यास',
          nextDayId: 'd3',
          nextLabel: 'अगला विचार (संस्करण 3) →',
          incomplete: 'सीख को आदत बनाने के लिए, बड़े इरादों के साथ ____ भी ज़रूरी है।',
          blankPrefix: 'सीख को आदत बनाने के लिए, बड़े इरादों के साथ ',
          blankSuffix: ' भी ज़रूरी है।',
          options: [
            { id: 'opt_2_1', text: 'सही मौके का इंतज़ार', isCorrect: false },
            { id: 'opt_2_2', text: 'दूसरों से तुलना', isCorrect: false },
            { id: 'opt_2_3', text: 'नियमित छोटा अभ्यास', isCorrect: true },
            { id: 'opt_2_4', text: 'जल्दी परिणाम की उम्मीद', isCorrect: false }
          ],
          fullThought: 'सीख को आदत बनाने के लिए, बड़े इरादों के साथ नियमित छोटा अभ्यास भी ज़रूरी है।',
          meaning: 'थोड़ा-थोड़ा अभ्यास नियमित रूप से करना, सीखी हुई बात को रोज़मर्रा के काम में लाने में मदद करता है।'
        },
        d3: {
          id: 'd3',
          dayNum: 3,
          theme: 'अनुभव',
          nextDayId: 'd1',
          nextLabel: 'पहला विचार (संस्करण 1) ↺',
          incomplete: 'बीते अनुभव अगला कदम बेहतर बनाते हैं, जब हम उन्हें ____।',
          blankPrefix: 'बीते अनुभव अगला कदम बेहतर बनाते हैं, जब हम उन्हें ',
          blankSuffix: '।',
          options: [
            { id: 'opt_3_1', text: 'ज्यों का त्यों दोहराते हैं', isCorrect: false },
            { id: 'opt_3_2', text: 'समझकर उनसे सीखते हैं', isCorrect: true },
            { id: 'opt_3_3', text: 'केवल याद रखते हैं', isCorrect: false },
            { id: 'opt_3_4', text: 'दूसरों पर लागू करते हैं', isCorrect: false }
          ],
          fullThought: 'बीते अनुभव अगला कदम बेहतर बनाते हैं, जब हम उन्हें समझकर उनसे सीखते हैं।',
          meaning: 'बीती बातों पर विचार करके हम समझ सकते हैं कि अगली बार क्या बनाए रखना है और क्या बदलना है।'
        }
      };

      const OPTION_LETTERS = ['A', 'B', 'C', 'D'];

      /* ============================================================
         STATE MANAGEMENT
         ============================================================ */
      const STORAGE_PREFIX = 'db-jam:v2:niti:';
      const USER_NAME_KEY = 'db_niti_user_name';
      const THEME_KEY = 'db_niti_active_theme';

      let currentDayId = 'd1';
      let selectedOptionId = null;
      let activeTheme = 'classic';
      let userName = '';

      try {
        userName = window.DBJamDemo.getItem(USER_NAME_KEY) || '';
        const savedTheme = window.DBJamDemo.getItem(THEME_KEY);
        if (savedTheme) activeTheme = savedTheme;
      } catch (e) {}

      function getStorageKey(dayId) {
        return STORAGE_PREFIX + dayId;
      }

      function loadStoredEdition(dayId) {
        try {
          const raw = window.DBJamDemo.getItem(getStorageKey(dayId));
          if (raw) return JSON.parse(raw);
        } catch (err) {}
        return null;
      }

      function saveStoredEdition(dayId, data) {
        try {
          window.DBJamDemo.setItem(getStorageKey(dayId), JSON.stringify(data));
        } catch (err) {}
      }

      function getInitialDayFromUrl() {
        return window.DBJamDemo.day;
      }

      /* ============================================================
         DOM ELEMENT REFS
         ============================================================ */
      const els = {
        stepAnswer: document.getElementById('step-answer'),
        stepCard: document.getElementById('step-card'),
        cardStage: document.getElementById('card-stage'),
        themeNameText: document.getElementById('theme-name-text'),
        thoughtCard: document.getElementById('thought-card'),
        thoughtContainer: document.getElementById('thought-text-container'),
        meaningRevealBox: document.getElementById('meaning-reveal-box'),
        meaningText: document.getElementById('meaning-text'),
        optionsGrid: document.getElementById('options-grid'),
        btnStep1Action: document.getElementById('btn-step1-action'),
        btnStep1Label: document.getElementById('btn-step1-label'),
        cardPreviewImg: document.getElementById('card-preview-img'),
        btnCornerShare: document.getElementById('btn-corner-share'),
        themeButtons: document.querySelectorAll('.theme-tab-btn'),
        cardUserNameInput: document.getElementById('card-user-name'),
        btnClearName: document.getElementById('btn-clear-name'),
        btnSharePrimary: document.getElementById('btn-share-primary'),
        btnGoHome: document.getElementById('btn-go-home'),
        btnGoNextEdition: document.getElementById('btn-go-next-edition'),
        nextEditionLabel: document.getElementById('next-edition-label'),
        shareCanvas: document.getElementById('shareCanvas'),
        toastPill: document.getElementById('toast-pill'),
        toastMsg: document.getElementById('toast-msg'),
        // Share Action Sheet Modal
        shareSheetBackdrop: document.getElementById('share-sheet-backdrop'),
        sheetBtnWhatsapp: document.getElementById('sheet-btn-whatsapp'),
        sheetBtnDownload: document.getElementById('sheet-btn-download'),
        sheetBtnCopy: document.getElementById('sheet-btn-copy'),
        sheetBtnCancel: document.getElementById('sheet-btn-cancel')
      };

      /* Toast Notification */
      let toastTimer = null;
      function showToast(msg) {
        if (!els.toastPill) return;
        els.toastMsg.textContent = msg;
        els.toastPill.classList.add('is-visible');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          els.toastPill.classList.remove('is-visible');
        }, 2200);
      }

      /* ============================================================
         SHARE ACTION SHEET (MODAL) CONTROLS
         ============================================================ */
      function openShareSheet() {
        if (!els.shareSheetBackdrop) return;
        els.shareSheetBackdrop.classList.add('is-open');
        els.shareSheetBackdrop.setAttribute('aria-hidden', 'false');
      }

      function closeShareSheet() {
        if (!els.shareSheetBackdrop) return;
        els.shareSheetBackdrop.classList.remove('is-open');
        els.shareSheetBackdrop.setAttribute('aria-hidden', 'true');
      }

      /* ============================================================
         STEP SWITCHING
         ============================================================ */
      function showStep(stepNum) {
        if (stepNum === 1) {
          els.stepAnswer.classList.add('is-active');
          els.stepCard.classList.remove('is-active');
        } else if (stepNum === 2) {
          els.stepAnswer.classList.remove('is-active');
          els.stepCard.classList.add('is-active');
          if (els.cardStage) {
            els.cardStage.setAttribute('data-active-theme', activeTheme);
          }
          updateNextButtonLabel();
          generateShareCard();
        }
      }

      function updateNextButtonLabel() {
        const data = CONTENT[currentDayId];
        if (els.nextEditionLabel && data) {
          els.nextEditionLabel.textContent = data.nextLabel;
        }
      }

      /* ============================================================
         RENDER STEP 1 (Answer View)
         ============================================================ */
      function renderStep1() {
        const data = CONTENT[currentDayId];
        const saved = loadStoredEdition(currentDayId);
        const isConfirmed = !!(saved && saved.confirmed);
        const effectiveSelectedId = isConfirmed ? saved.selectedOption : selectedOptionId;

        els.themeNameText.textContent = data.theme;

        // Render Thought with Interactive Blank Slot
        els.thoughtContainer.innerHTML = '';
        els.thoughtContainer.appendChild(document.createTextNode(data.blankPrefix));

        const blankSpan = document.createElement('span');
        blankSpan.id = 'thought-blank-slot';
        blankSpan.className = 'thought-blank-slot';

        if (isConfirmed) {
          const correctOpt = data.options.find(o => o.isCorrect);
          blankSpan.textContent = correctOpt ? correctOpt.text : '...';
          blankSpan.classList.add('is-correct');
        } else if (effectiveSelectedId) {
          const chosenOpt = data.options.find(o => o.id === effectiveSelectedId);
          blankSpan.textContent = chosenOpt ? chosenOpt.text : '';
          blankSpan.classList.add('is-preview');
        } else {
          blankSpan.textContent = '____';
          blankSpan.classList.add('is-empty');
        }
        els.thoughtContainer.appendChild(blankSpan);
        els.thoughtContainer.appendChild(document.createTextNode(data.blankSuffix));

        // Meaning Box
        if (isConfirmed) {
          els.meaningText.textContent = data.meaning;
          els.meaningRevealBox.classList.add('is-visible');
        } else {
          els.meaningRevealBox.classList.remove('is-visible');
        }

        // 2x2 Options Grid (A, B on top, C, D on bottom)
        els.optionsGrid.innerHTML = '';
        data.options.forEach((opt, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'opt-card-btn';
          btn.id = `opt-btn-${opt.id}`;
          btn.dataset.optId = opt.id;
          btn.setAttribute('role', 'radio');

          const letter = OPTION_LETTERS[index] || (index + 1);

          const badge = document.createElement('div');
          badge.className = 'opt-badge';
          badge.textContent = letter;

          const textWrap = document.createElement('div');
          textWrap.className = 'opt-text';
          textWrap.textContent = opt.text;

          btn.appendChild(badge);
          btn.appendChild(textWrap);

          if (isConfirmed) {
            btn.disabled = true;
            btn.setAttribute('aria-disabled', 'true');

            const isUserChoice = (saved.selectedOption === opt.id);
            const isAuthoredCorrect = opt.isCorrect;

            if (isAuthoredCorrect) {
              btn.classList.add('is-correct');
              badge.textContent = '✓';
            } else if (isUserChoice) {
              btn.classList.add('is-wrong');
              badge.textContent = '✕';
            } else {
              btn.classList.add('is-dimmed');
            }
          } else {
            const isSelected = (opt.id === effectiveSelectedId);
            if (isSelected) {
              btn.classList.add('is-selected');
              btn.setAttribute('aria-checked', 'true');
            } else {
              btn.setAttribute('aria-checked', 'false');
            }

            btn.addEventListener('click', () => {
              selectedOptionId = opt.id;
              renderStep1();
            });
          }

          els.optionsGrid.appendChild(btn);
        });

        // Bottom Action Button
        if (isConfirmed) {
          els.btnStep1Action.disabled = false;
          els.btnStep1Action.classList.add('is-goto-card');
          els.btnStep1Label.textContent = 'विचार कार्ड बनाएं एवं साझा करें →';
          els.btnStep1Action.querySelector('svg').style.display = 'none';
        } else {
          els.btnStep1Action.classList.remove('is-goto-card');
          els.btnStep1Label.textContent = 'उत्तर चुनें';
          els.btnStep1Action.querySelector('svg').style.display = 'inline-block';
          els.btnStep1Action.disabled = !effectiveSelectedId;
        }
      }

      function handleStep1Confirm() {
        const data = CONTENT[currentDayId];
        const saved = loadStoredEdition(currentDayId);

        if (saved && saved.confirmed) {
          showStep(2);
          return;
        }

        if (!selectedOptionId) return;

        const chosenOpt = data.options.find(o => o.id === selectedOptionId);
        const isCorrect = chosenOpt ? chosenOpt.isCorrect : false;

        saveStoredEdition(currentDayId, {
          confirmed: true,
          selectedOption: selectedOptionId,
          isCorrect: isCorrect,
          answeredAt: new Date().toISOString()
        });

        // Host reporting
        try {
          if (window.DBGameLab && typeof window.DBGameLab.reportScore === 'function') {
            window.DBGameLab.reportScore(isCorrect ? 10 : 5);
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'GAME_COMPLETE',
              gameId: 'niti',
              score: isCorrect ? 10 : 5,
              edition: currentDayId
            }, '*');
          }
        } catch (e) {}

        renderStep1();
        showToast(isCorrect ? 'उत्कृष्ट! विचार का अर्थ समझें' : 'विचार का सही अर्थ नीचे देखें');
      }

      /* ============================================================
         TEXT WRAPPING UTILITY FOR CANVAS
         ============================================================ */
      function wrapTextLines(ctx, text, maxWidth) {
        const words = text.split(' ');
        const lines = [];
        let currentLine = '';

        for (let i = 0; i < words.length; i++) {
          const word = words[i];
          const testLine = currentLine ? (currentLine + ' ' + word) : word;
          const metrics = ctx.measureText(testLine);

          if (metrics.width > maxWidth && currentLine !== '') {
            lines.push(currentLine);
            currentLine = word;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);
        return lines;
      }

      /* ============================================================
         PROCEDURAL ARTWORK & DECORATIVE ILLUSTRATIONS
         ============================================================ */

      // 1. Draw Glowing Clay Diya
      function drawDiya(ctx, x, y, scale = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Radiant Golden Aura
        const glow = ctx.createRadialGradient(0, -22, 6, 0, -22, 75);
        glow.addColorStop(0, 'rgba(255, 235, 59, 0.95)');
        glow.addColorStop(0.35, 'rgba(255, 152, 0, 0.5)');
        glow.addColorStop(1, 'rgba(255, 152, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, -22, 75, 0, Math.PI * 2);
        ctx.fill();

        // Diya Flame (Inner white, middle gold, outer orange)
        ctx.beginPath();
        ctx.moveTo(0, -52);
        ctx.quadraticCurveTo(15, -25, 10, -5);
        ctx.quadraticCurveTo(0, 0, -10, -5);
        ctx.quadraticCurveTo(-15, -25, 0, -52);
        const flameGrad = ctx.createLinearGradient(0, -52, 0, 0);
        flameGrad.addColorStop(0, '#FFFFFF');
        flameGrad.addColorStop(0.3, '#FFF59D');
        flameGrad.addColorStop(0.7, '#FF9800');
        flameGrad.addColorStop(1, '#D84315');
        ctx.fillStyle = flameGrad;
        ctx.fill();

        // Blue inner flame core
        ctx.beginPath();
        ctx.ellipse(0, -4, 4, 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(66, 165, 245, 0.7)';
        ctx.fill();

        // Terracotta Diya Bowl
        ctx.beginPath();
        ctx.moveTo(-42, -5);
        ctx.quadraticCurveTo(-46, 28, 0, 30);
        ctx.quadraticCurveTo(46, 28, 42, -5);
        ctx.quadraticCurveTo(24, 3, 0, 3);
        ctx.quadraticCurveTo(-24, 3, -42, -5);
        const diyaGrad = ctx.createLinearGradient(0, -5, 0, 30);
        diyaGrad.addColorStop(0, '#E67E22');
        diyaGrad.addColorStop(0.5, '#D35400');
        diyaGrad.addColorStop(1, '#873600');
        ctx.fillStyle = diyaGrad;
        ctx.fill();

        // Golden Rim & Pearl Details
        ctx.strokeStyle = '#F1C40F';
        ctx.lineWidth = 2.8;
        ctx.stroke();

        ctx.fillStyle = '#F1C40F';
        [-26, -13, 0, 13, 26].forEach(dotX => {
          ctx.beginPath();
          ctx.arc(dotX, 14 - Math.abs(dotX) * 0.15, 2.8, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      // 2. Draw Crossed Festive Dandiya Sticks with Tassels (Large Scale)
      function drawCrossedDandiyas(ctx, x, y, scale = 1.8) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const drawStick = (angle) => {
          ctx.save();
          ctx.rotate((angle * Math.PI) / 180);

          // Stick body
          ctx.beginPath();
          ctx.roundRect(-8, -80, 16, 160, 8);
          const stickGrad = ctx.createLinearGradient(-8, 0, 8, 0);
          stickGrad.addColorStop(0, '#F39C12');
          stickGrad.addColorStop(0.5, '#F1C40F');
          stickGrad.addColorStop(1, '#D35400');
          ctx.fillStyle = stickGrad;
          ctx.fill();
          ctx.strokeStyle = '#B03A2E';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Wrapped colorful ribbon bands
          const bands = [-60, -38, -16, 6, 28, 50];
          bands.forEach((bY, idx) => {
            ctx.fillStyle = idx % 2 === 0 ? '#C0392B' : '#27AE60';
            ctx.fillRect(-8, bY, 16, 10);
            ctx.strokeStyle = '#F1C40F';
            ctx.lineWidth = 1.4;
            ctx.strokeRect(-8, bY, 16, 10);
          });

          // Golden bell at handle
          ctx.fillStyle = '#F1C40F';
          ctx.beginPath();
          ctx.arc(0, 88, 8, 0, Math.PI * 2);
          ctx.fill();

          // Tassel threads
          ctx.strokeStyle = '#E74C3C';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.moveTo(0, 96);
          ctx.lineTo(-7, 114);
          ctx.moveTo(0, 96);
          ctx.lineTo(7, 114);
          ctx.stroke();

          ctx.restore();
        };

        drawStick(-32);
        drawStick(32);

        // Center tie flower
        ctx.fillStyle = '#C0392B';
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#F1C40F';
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 3. Draw Grand Surya-Kamal (Sun & Lotus) Mandala Artwork for Classic Theme (Grand Scale)
      function drawSuryaKamalMedallion(ctx, cx, cy, radius = 110) {
        ctx.save();
        ctx.translate(cx, cy);

        // Ambient radiant halo
        const haloGrad = ctx.createRadialGradient(0, 0, 15, 0, 0, radius * 1.35);
        haloGrad.addColorStop(0, 'rgba(243, 156, 18, 0.28)');
        haloGrad.addColorStop(0.55, 'rgba(226, 58, 40, 0.1)');
        haloGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.35, 0, Math.PI * 2);
        ctx.fill();

        // 16 Radiant Triangular Sun Rays
        ctx.fillStyle = '#E23A28';
        for (let i = 0; i < 16; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI) / 8);
          ctx.beginPath();
          ctx.moveTo(0, -radius * 0.72);
          ctx.lineTo(9, -radius);
          ctx.lineTo(-9, -radius);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Inner Sun Circle
        ctx.fillStyle = '#F39C12';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#D35400';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // 12 Delicate Lotus Petals
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2.6;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        for (let j = 0; j < 12; j++) {
          ctx.save();
          ctx.rotate((j * Math.PI) / 6);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(18, -radius * 0.38, 0, -radius * 0.65);
          ctx.quadraticCurveTo(-18, -radius * 0.38, 0, 0);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // Center Golden Bindu & Core
        ctx.fillStyle = '#E23A28';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F1C40F';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#F1C40F';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.1, 0, Math.PI * 2);
        ctx.fill();

        // Flanking graceful ornamental leafy vines
        const drawVine = (direction) => {
          ctx.save();
          ctx.scale(direction, 1);
          ctx.strokeStyle = '#D35400';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(radius * 1.05, 0);
          ctx.quadraticCurveTo(radius * 1.55, -24, radius * 2.2, 0);
          ctx.stroke();

          // Leaf florets
          [-15, 12].forEach(offsetY => {
            ctx.fillStyle = '#E23A28';
            ctx.beginPath();
            ctx.ellipse(radius * 1.65, offsetY, 10, 5, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        };

        drawVine(1);
        drawVine(-1);

        ctx.restore();
      }

      // 4. Draw Traditional Gujarati Checkered Bandhani Border
      function drawCheckeredBorder(ctx, width, height, inset, thickness) {
        ctx.save();
        const colors = ['#C0392B', '#F1C40F', '#27AE60', '#E67E22'];
        const size = thickness;

        const countX = Math.floor((width - inset * 2) / size);
        for (let i = 0; i < countX; i++) {
          ctx.fillStyle = colors[i % colors.length];
          ctx.fillRect(inset + i * size, inset, size, size);
          ctx.fillStyle = colors[(i + 2) % colors.length];
          ctx.fillRect(inset + i * size, height - inset - size, size, size);
        }

        const countY = Math.floor((height - inset * 2) / size);
        for (let j = 0; j < countY; j++) {
          ctx.fillStyle = colors[(j + 1) % colors.length];
          ctx.fillRect(inset, inset + j * size, size, size);
          ctx.fillStyle = colors[(j + 3) % colors.length];
          ctx.fillRect(width - inset - size, inset + j * size, size, size);
        }

        ctx.restore();
      }

      // 5. Draw Hanging Marigold & Mango Leaf Toran (Bandhanwar)
      function drawHangingToran(ctx, width, startY) {
        ctx.save();
        const segments = 9;
        const segWidth = (width - 120) / segments;
        const startX = 60;

        ctx.strokeStyle = '#D35400';
        ctx.lineWidth = 2.5;

        for (let i = 0; i < segments; i++) {
          const x1 = startX + i * segWidth;
          const x2 = x1 + segWidth;
          const midX = (x1 + x2) / 2;
          const dropY = startY + 22;

          // Hanging rope loop
          ctx.beginPath();
          ctx.moveTo(x1, startY);
          ctx.quadraticCurveTo(midX, dropY, x2, startY);
          ctx.stroke();

          // Green mango leaf (आम्रपल्लव)
          ctx.fillStyle = '#27AE60';
          ctx.beginPath();
          ctx.ellipse(midX, dropY + 12, 6, 16, 0, 0, Math.PI * 2);
          ctx.fill();

          // Orange Marigold floret (गेंदा फूल)
          ctx.fillStyle = '#F39C12';
          ctx.beginPath();
          ctx.arc(midX, dropY + 2, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#C0392B';
          ctx.beginPath();
          ctx.arc(midX, dropY + 2, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      // 6. Draw Hanging Festive Kandil / Lantern for Diwali Corners
      function drawHangingLantern(ctx, x, y, scale = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Hanging string
        ctx.strokeStyle = '#F1C40F';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(0, -40);
        ctx.lineTo(0, 0);
        ctx.stroke();

        // Lantern Diamond Frame
        ctx.fillStyle = '#F39C12';
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(18, 0);
        ctx.lineTo(0, 18);
        ctx.lineTo(-18, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#F1C40F';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Inner glowing core
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();

        // Tassels hanging below
        ctx.strokeStyle = '#E74C3C';
        ctx.lineWidth = 2;
        [-10, 0, 10].forEach(tX => {
          ctx.beginPath();
          ctx.moveTo(tX * 0.6, 18);
          ctx.lineTo(tX * 0.9, 36);
          ctx.stroke();
        });

        ctx.restore();
      }

      // 7. Draw Background Mandala Watermark
      function drawMandalaWatermark(ctx, cx, cy, radius, color) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();

        for (let i = 0; i < 12; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI) / 6);
          ctx.beginPath();
          ctx.moveTo(0, radius * 0.35);
          ctx.quadraticCurveTo(radius * 0.25, radius * 0.65, 0, radius);
          ctx.quadraticCurveTo(-radius * 0.25, radius * 0.65, 0, radius * 0.35);
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }

          ctx.fill();
          ctx.strokeStyle = '#C0392B';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Line 1: सप्रेम प्रेषक · पावन शुभकामनाएं
          ctx.fillStyle = '#C0392B';
          ctx.font = 'bold 21px "Noto Sans Devanagari", sans-serif';
          ctx.fillText('🌸 सप्रेम प्रेषक · पावन नवरात्रि शुभकामनाएं 🌸', width / 2, wishY - 8);

          // Line 2: Big Bold Family Name
          ctx.fillStyle = '#922B21';
          ctx.font = 'bold 40px "Rozha One", "Martel", serif';
          ctx.fillText(familyName, width / 2, wishY + 36);

          // Footer Baseline
          ctx.fillStyle = '#8D6E63';
          ctx.font = 'bold 23px "Noto Sans Devanagari", sans-serif';
          ctx.fillText('॥ ॐ ऐं ह्रीं क्लीं चामुण्डायै विच्चे ॥ · दैनिक भास्कर खेल', width / 2, 1260);

        // -------------------------------------------------------------
        // THEME 3: CLASSIC / NORMAL (सामान्य) — Fully Balanced & Glorious
        // -------------------------------------------------------------
        } else {
          // Warm editorial handmade parchment gradient
          const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
          bgGrad.addColorStop(0, '#FAF7EE');
          bgGrad.addColorStop(1, '#F2EAE0');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, height);

          // Warm subtle Mandala Watermark in center
          drawMandalaWatermark(ctx, width / 2, height * 0.48, 420, 'rgba(226, 58, 40, 0.06)');

          // Outer Dainik Bhaskar Red Frame
          ctx.strokeStyle = '#E23A28';
          ctx.lineWidth = 3.5;
          ctx.strokeRect(36, 36, width - 72, height - 72);

          // Inner Golden Bronze Frame
          ctx.strokeStyle = 'rgba(211, 84, 0, 0.35)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(48, 48, width - 96, height - 96);

          // Ornate Corner Filigree / Brackets
          [48, width - 48].forEach(cx => {
            [48, height - 48].forEach(cy => {
              ctx.strokeStyle = '#E23A28';
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.arc(cx, cy, 14, 0, Math.PI * 2);
              ctx.stroke();
              ctx.fillStyle = '#D35400';
              ctx.beginPath();
              ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
              ctx.fill();
            });
          });

          // Top Golden Sun (Surya) Emblem
          ctx.save();
          ctx.translate(width / 2, 98);
          ctx.fillStyle = '#E23A28';
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#D35400';
          ctx.lineWidth = 3.5;
          for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI) / 4;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * 23, Math.sin(angle) * 23);
            ctx.lineTo(Math.cos(angle) * 31, Math.sin(angle) * 31);
            ctx.stroke();
          }
          ctx.restore();

          // Masthead: Dainik Bhaskar · Aaj Ki Niti
          ctx.textAlign = 'center';
          ctx.fillStyle = '#E23A28';
          ctx.font = 'bold 44px "Noto Sans Devanagari", "Martel", serif';
          ctx.fillText(`दैनिक भास्कर · आज की नीति`, width / 2, 175);

          // Thematic Subtitle Pill (Clean editorial tagline, no duplicate name!)
          const subText = `✨ अमृत विचार · जीवन दर्शन ✨`;
          ctx.font = 'bold 24px "Noto Sans Devanagari", sans-serif';
          const badgeW = ctx.measureText(subText).width + 56;
          ctx.fillStyle = '#FDECE9';
          ctx.beginPath();
          ctx.roundRect((width - badgeW) / 2, 206, badgeW, 40, 20);
          ctx.fill();
          ctx.strokeStyle = 'rgba(226, 58, 40, 0.45)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = '#C52C1C';
          ctx.fillText(subText, width / 2, 234);

          // Large Quote Mark
          ctx.fillStyle = 'rgba(226, 58, 40, 0.28)';
          ctx.font = 'bold 120px "Georgia", serif';
          ctx.fillText('“', width / 2, 325);

          // HERO: Central Thought Text (High Weight, 70px Bold Serif)
          ctx.fillStyle = '#1A1A1A';
          ctx.font = 'bold 70px "Noto Sans Devanagari", "Rozha One", serif';
          const thoughtLines = wrapTextLines(ctx, `“${data.fullThought}”`, contentWidth);
          const tLineHeight = 98;
          let tY = 385;
          thoughtLines.forEach(line => {
            ctx.fillText(line, width / 2, tY);
            tY += tLineHeight;
          });

          // Sunburst Center Divider
          const divY = tY + 14;
          ctx.strokeStyle = 'rgba(211, 84, 0, 0.45)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(width / 2 - 180, divY);
          ctx.lineTo(width / 2 - 35, divY);
          ctx.moveTo(width / 2 + 35, divY);
          ctx.lineTo(width / 2 + 180, divY);
          ctx.stroke();
          ctx.font = '28px "Noto Sans Devanagari", sans-serif';
          ctx.fillText('☀️', width / 2, divY + 9);

          // Meaning Box: Solid, Warm Textured Plaque (Unified Title)
          const boxY = divY + 44;
          ctx.font = 'bold 40px "Noto Sans Devanagari", sans-serif';
          const meaningLines = wrapTextLines(ctx, data.meaning, contentWidth - 80);
          const mLineHeight = 62;
          const boxHeight = 74 + (meaningLines.length * mLineHeight) + 26;

          // Box Background
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.roundRect((width - contentWidth) / 2, boxY, contentWidth, boxHeight, 20);
          ctx.fill();
          ctx.strokeStyle = 'rgba(211, 84, 0, 0.38)';
          ctx.lineWidth = 1.6;
          ctx.stroke();

          // Left Terracotta Bar
          ctx.fillStyle = '#D35400';
          ctx.beginPath();
          ctx.roundRect((width - contentWidth) / 2, boxY, 7, boxHeight, [20, 0, 0, 20]);
          ctx.fill();

          // Unified Meaning Header: विचार का आलोक (अर्थ)
          ctx.fillStyle = '#D35400';
          ctx.font = 'bold 30px "Noto Sans Devanagari", sans-serif';
          ctx.fillText('📖 विचार का आलोक (अर्थ)', width / 2, boxY + 46);

          // Meaning Text
          let mTextY = boxY + 108;
          ctx.fillStyle = '#2B2B2B';
          ctx.font = '600 38px "Noto Sans Devanagari", sans-serif';
          meaningLines.forEach(line => {
            ctx.fillText(line, width / 2, mTextY);
            mTextY += mLineHeight;
          });

          // Grand Surya-Kamal (Sun & Lotus) Mandala Artwork (Large Centerpiece)
          const mandalaY = boxY + boxHeight + 96;
          drawSuryaKamalMedallion(ctx, width / 2, mandalaY, 115);

          // Grand Bottom Sender Signature (2-Line, No Overlaps, Big Name)
          const wishY = mandalaY + 112;
          ctx.font = 'bold 40px "Rozha One", "Martel", serif';
          const nameW = ctx.measureText(familyName).width;
          const sigBoxW = Math.max(nameW + 100, 560);
          const sigBoxH = 88;

          ctx.fillStyle = '#FDECE9';
          ctx.beginPath();
          ctx.roundRect((width - sigBoxW) / 2, wishY - 34, sigBoxW, sigBoxH, 22);
          ctx.fill();
          ctx.strokeStyle = '#E23A28';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Line 1: सप्रेम प्रेषक
          ctx.fillStyle = '#C52C1C';
          ctx.font = 'bold 21px "Noto Sans Devanagari", sans-serif';
          ctx.fillText('🌸 सप्रेम प्रेषक 🌸', width / 2, wishY - 8);

          // Line 2: Big Bold Family Name
          ctx.fillStyle = '#1A1A1A';
          ctx.font = 'bold 40px "Rozha One", "Martel", serif';
          ctx.fillText(familyName, width / 2, wishY + 36);

          // Footer Baseline
          ctx.fillStyle = '#666666';
          ctx.font = 'bold 23px "Noto Sans Devanagari", sans-serif';
          ctx.fillText('सत्यमेव जयते · अमृत विचार · दैनिक भास्कर खेल', width / 2, 1260);
        }

        // Update in-page preview image
        try {
          const dataUrl = canvas.toDataURL('image/png');
          if (els.cardPreviewImg) {
            els.cardPreviewImg.src = dataUrl;
          }
        } catch (err) {}
      }

      /* ============================================================
         DOWNLOAD & SHARE ACTIONS
         ============================================================ */
      function downloadCard() {
        const canvas = els.shareCanvas;
        if (!canvas) return;
        const data = CONTENT[currentDayId];
        const filename = `aaj-ki-niti-${data.id}-${activeTheme}.png`;

        try {
          if (canvas.toBlob) {
            canvas.toBlob(blob => {
              if (!blob) {
                fallbackDownload(canvas.toDataURL('image/png'), filename);
                return;
              }
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = filename;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 2000);
              showToast('कार्ड डाउनलोड हो गया!');
            }, 'image/png');
          } else {
            fallbackDownload(canvas.toDataURL('image/png'), filename);
          }
        } catch (e) {
          fallbackDownload(canvas.toDataURL('image/png'), filename);
        }
      }

      function fallbackDownload(dataUrl, filename) {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('कार्ड डाउनलोड हो गया!');
      }

      function getFormattedShareText(data) {
        const familyName = userName.trim() || 'सुहास और परिवार';
        let festGreeting = '';
        if (activeTheme === 'diwali') {
          festGreeting = `🪔 शुभ दीपावली — ${familyName} 🪔\n\n`;
        } else if (activeTheme === 'navratri') {
          festGreeting = `🌸 शुभ नवरात्रि — ${familyName} 🌸\n\n`;
        } else {
          festGreeting = `🌸 आज की नीति — सप्रेम प्रेषक: ${familyName} 🌸\n\n`;
        }
        return `${festGreeting}"${data.fullThought}"\n\nविचार का आलोक (अर्थ): ${data.meaning}\n\nदैनिक भास्कर खेल`;
      }

      async function handleShareAction() {
        const data = CONTENT[currentDayId];
        const canvas = els.shareCanvas;

        if (navigator.share && navigator.canShare && canvas && canvas.toBlob) {
          try {
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (blob) {
              const file = new File([blob], `aaj-ki-niti-${data.id}-${activeTheme}.png`, { type: 'image/png' });
              const shareData = {
                title: `आज की नीति · ${data.theme}`,
                text: getFormattedShareText(data),
                files: [file]
              };

              if (navigator.canShare(shareData)) {
                await navigator.share(shareData);
                showToast('कार्ड साझा किया गया!');
                return;
              }
            }
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        downloadCard();
        copyThoughtToClipboard();
      }

      async function copyThoughtToClipboard() {
        const data = CONTENT[currentDayId];
        const shareText = getFormattedShareText(data);

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(shareText);
            showToast('विचार टेक्स्ट कॉपी हो गया!');
            return;
          }
        } catch (err) {}

        window.prompt('विचार टेक्स्ट कॉपी करें (Ctrl+C):', shareText);
      }

      /* Navigation Actions: Home & Next Edition */
      function navigateHome() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.location.hash = '#/';
          } else {
            window.location.hash = '#/';
            window.location.href = '/#/';
          }
        } catch (e) {
          window.location.href = '/';
        }
      }

      function navigateNextEdition() {
        const currentData = CONTENT[currentDayId];
        const nextId = currentData.nextDayId || 'd1';

        currentDayId = nextId;
        selectedOptionId = null;

        try {
          const url = new URL(window.location);
          url.searchParams.set('day', nextId);
          window.history.replaceState({}, '', url);
        } catch (e) {}

        renderStep1();
        showStep(1);
        showToast(`संस्करण ${CONTENT[nextId].dayNum} शुरू`);
      }

      /* ============================================================
         EVENT LISTENERS & BINDINGS
         ============================================================ */
      function initEventListeners() {
        // Step 1 Confirm Action
        els.btnStep1Action.addEventListener('click', handleStep1Confirm);

        // 3 Theme Tabs (Above Card): सामान्य, नवरात्रि, दिवाली
        els.themeButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            const themeKey = btn.dataset.theme;
            activeTheme = themeKey;
            try { window.DBJamDemo.setItem(THEME_KEY, activeTheme); } catch (e) {}

            els.themeButtons.forEach(b => b.classList.toggle('is-active', b === btn));
            if (els.cardStage) {
              els.cardStage.setAttribute('data-active-theme', activeTheme);
            }
            generateShareCard();
            const labelText = btn.querySelector('span:last-child')?.textContent?.trim() || btn.textContent.trim();
            showToast(`थीम: ${labelText}`);
          });
        });

        // User Name Input (Real-time card re-rendering)
        if (els.cardUserNameInput) {
          els.cardUserNameInput.value = userName;
          if (userName.trim()) els.btnClearName.style.display = 'inline-block';

          let nameDebounceTimer = null;
          els.cardUserNameInput.addEventListener('input', (e) => {
            userName = e.target.value;
            els.btnClearName.style.display = userName.trim() ? 'inline-block' : 'none';

            try { window.DBJamDemo.setItem(USER_NAME_KEY, userName); } catch (err) {}

            if (nameDebounceTimer) clearTimeout(nameDebounceTimer);
            nameDebounceTimer = setTimeout(() => {
              generateShareCard();
            }, 100);
          });

          els.btnClearName.addEventListener('click', () => {
            userName = '';
            els.cardUserNameInput.value = '';
            els.btnClearName.style.display = 'none';
            try { window.DBJamDemo.removeItem(USER_NAME_KEY); } catch (e) {}
            generateShareCard();
          });
        }

        // Corner Share Button: opens share modal sheet
        if (els.btnCornerShare) {
          els.btnCornerShare.addEventListener('click', openShareSheet);
        }

        // Primary Hero Share CTA: opens share modal sheet
        if (els.btnSharePrimary) {
          els.btnSharePrimary.addEventListener('click', openShareSheet);
        }

        // Inside Share Modal Sheet:
        if (els.sheetBtnWhatsapp) {
          els.sheetBtnWhatsapp.addEventListener('click', () => {
            closeShareSheet();
            handleShareAction();
          });
        }

        if (els.sheetBtnDownload) {
          els.sheetBtnDownload.addEventListener('click', () => {
            closeShareSheet();
            downloadCard();
          });
        }

        if (els.sheetBtnCopy) {
          els.sheetBtnCopy.addEventListener('click', () => {
            closeShareSheet();
            copyThoughtToClipboard();
          });
        }

        if (els.sheetBtnCancel) {
          els.sheetBtnCancel.addEventListener('click', closeShareSheet);
        }

        if (els.shareSheetBackdrop) {
          els.shareSheetBackdrop.addEventListener('click', (e) => {
            if (e.target === els.shareSheetBackdrop) {
              closeShareSheet();
            }
          });
        }

        // Navigation (Home & Next Edition)
        els.btnGoHome.addEventListener('click', navigateHome);
        els.btnGoNextEdition.addEventListener('click', navigateNextEdition);
      }

      /* ============================================================
         INITIALIZATION
         ============================================================ */
      function init() {
        currentDayId = getInitialDayFromUrl();
        initEventListeners();

        // Restore active theme tab
        els.themeButtons.forEach(btn => {
          btn.classList.toggle('is-active', btn.dataset.theme === activeTheme);
        });

        if (els.cardStage) {
          els.cardStage.setAttribute('data-active-theme', activeTheme);
        }

        renderStep1();

        const saved = loadStoredEdition(currentDayId);
        if (saved && saved.confirmed) {
          showStep(1);
        } else {
          showStep(1);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
