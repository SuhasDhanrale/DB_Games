<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (window.self === window.top) {
            window.location.href = '/';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-correct: #6aaa64;
            --color-present: #c9b458;
            --color-absent: #787c7e;
            --color-empty: #ffffff;
            --color-border: #d3d6da;
            --color-text: #1a1a1b;
            --color-key: #d3d6da;
        }

        body {
            background-color: var(--color-empty);
            color: var(--color-text);
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            /* Prevent double-tap zoom */
        }

        header {
            width: 100%;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin: 0;
        }

        #game-board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
            padding: 10px;
            box-sizing: border-box;
            width: 100%;
            max-width: 350px;
            flex-grow: 1;
            /* Allow board to take available space */
            justify-content: center;
            align-content: center;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
        }

        .tile {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid var(--color-border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.1s;
        }

        /* Animation for typing */
        .tile[data-state="tbd"] {
            border-color: #878a8c;
            animation: pop 0.1s;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Flip animation states */
        .tile.correct {
            background-color: var(--color-correct);
            border-color: var(--color-correct);
            color: white;
        }

        .tile.present {
            background-color: var(--color-present);
            border-color: var(--color-present);
            color: white;
        }

        .tile.absent {
            background-color: var(--color-absent);
            border-color: var(--color-absent);
            color: white;
        }

        #keyboard {
            width: 100%;
            max-width: 500px;
            padding: 0 8px;
            margin-bottom: 20px;
            user-select: none;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 8px;
            touch-action: manipulation;
        }

        .key {
            font-family: inherit;
            font-weight: bold;
            border: 0;
            padding: 0;
            margin: 0 3px;
            height: 58px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            background-color: var(--color-key);
            color: var(--color-text);
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }

        .key:active {
            opacity: 0.8;
        }

        .key.large {
            flex: 1.5;
            font-size: 12px;
        }

        .key.correct {
            background-color: var(--color-correct);
            color: white;
        }

        .key.present {
            background-color: var(--color-present);
            color: white;
        }

        .key.absent {
            background-color: var(--color-absent);
            color: white;
        }

        /* Message Box */
        #message-container {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .message {
            background-color: #fff;
            color: #000;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-weight: bold;
            opacity: 1;
            transition: opacity 0.5s ease-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .message.fade-out {
            opacity: 0;
        }

        /* Modal for Game Over */
        #modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #ffffff;
            border: 1px solid #d3d6da;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 80%;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .btn-restart {
            background-color: var(--color-correct);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>WORDLE</h1>
    </header>

    <div id="message-container"></div>

    <div id="game-board">
        <!-- Rows will be generated by JS -->
    </div>

    <div id="keyboard">
        <div class="keyboard-row">
            <button class="key" data-key="q">q</button>
            <button class="key" data-key="w">w</button>
            <button class="key" data-key="e">e</button>
            <button class="key" data-key="r">r</button>
            <button class="key" data-key="t">t</button>
            <button class="key" data-key="y">y</button>
            <button class="key" data-key="u">u</button>
            <button class="key" data-key="i">i</button>
            <button class="key" data-key="o">o</button>
            <button class="key" data-key="p">p</button>
        </div>
        <div class="keyboard-row">
            <div style="flex: 0.5;"></div> <!-- Spacer -->
            <button class="key" data-key="a">a</button>
            <button class="key" data-key="s">s</button>
            <button class="key" data-key="d">d</button>
            <button class="key" data-key="f">f</button>
            <button class="key" data-key="g">g</button>
            <button class="key" data-key="h">h</button>
            <button class="key" data-key="j">j</button>
            <button class="key" data-key="k">k</button>
            <button class="key" data-key="l">l</button>
            <div style="flex: 0.5;"></div> <!-- Spacer -->
        </div>
        <div class="keyboard-row">
            <button class="key large" data-key="enter">ENTER</button>
            <button class="key" data-key="z">z</button>
            <button class="key" data-key="x">x</button>
            <button class="key" data-key="c">c</button>
            <button class="key" data-key="v">v</button>
            <button class="key" data-key="b">b</button>
            <button class="key" data-key="n">n</button>
            <button class="key" data-key="m">m</button>
            <button class="key large" data-key="backspace">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
                    <path fill="currentColor"
                        d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z">
                    </path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Modal for game over -->
    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Game Over</h2>
            <p id="modal-message"></p>
            <button class="btn-restart" onclick="initGame()">Play Again</button>
        </div>
    </div>

    <script>
        // List of possible target words (simplified list for example)
        const targetWords = [
            "SUPER", "SHOUT", "APPLE", "TRAIN", "HOUSE", "MOUSE", "SMILE", "BREAD",
            "WATER", "PLANT", "EARTH", "NIGHT", "LIGHT", "DREAM", "MUSIC", "RIVER",
            "STONE", "CLOUD", "HEART", "WORLD", "PEACE", "GHOST", "BLANK", "STARE"
        ];

        // List of all valid guesses (typically much larger than target words)
        // For this demo, we'll just use the target words as the dictionary
        const dictionary = [...targetWords];

        const ROW_COUNT = 6;
        const COL_COUNT = 5;

        let targetWord = "";
        let currentAttempt = 0;
        let currentLetterPosition = 0;
        let grid = [];
        let gameOver = false;

        const boardElement = document.getElementById("game-board");
        const keyboardElement = document.getElementById("keyboard");
        const messageContainer = document.getElementById("message-container");
        const modal = document.getElementById("modal");

        function initGame() {
            // Reset state
            currentAttempt = 0;
            currentLetterPosition = 0;
            grid = Array(ROW_COUNT).fill(null).map(() => Array(COL_COUNT).fill(""));
            gameOver = false;

            // Pick a new word
            targetWord = targetWords[Math.floor(Math.random() * targetWords.length)];
            console.log("Target word (for debugging):", targetWord);

            // Hide modal if visible
            modal.style.display = 'none';

            // Clear board UI
            boardElement.innerHTML = '';
            for (let r = 0; r < ROW_COUNT; r++) {
                const row = document.createElement("div");
                row.className = "row";
                row.id = `row-${r}`;

                for (let c = 0; c < COL_COUNT; c++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    tile.id = `tile-${r}-${c}`;
                    row.appendChild(tile);
                }
                boardElement.appendChild(row);
            }

            // Reset keyboard colors
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.classList.remove('correct', 'present', 'absent');
            });
        }

        function handleKeyClick(key) {
            if (gameOver) return;

            if (key === 'enter') {
                submitGuess();
            } else if (key === 'backspace' || key === 'delete') {
                deleteLetter();
            } else if (/^[a-z]$/.test(key)) {
                addLetter(key);
            }
        }

        function addLetter(letter) {
            if (currentLetterPosition < COL_COUNT) {
                grid[currentAttempt][currentLetterPosition] = letter;
                updateTileUI(currentAttempt, currentLetterPosition, letter, 'tbd');
                currentLetterPosition++;
            }
        }

        function deleteLetter() {
            if (currentLetterPosition > 0) {
                currentLetterPosition--;
                grid[currentAttempt][currentLetterPosition] = "";
                updateTileUI(currentAttempt, currentLetterPosition, "");
            }
        }

        function updateTileUI(row, col, letter, state = "") {
            const tile = document.getElementById(`tile-${row}-${col}`);
            tile.textContent = letter;

            if (state === 'tbd') {
                tile.setAttribute('data-state', 'tbd');
            } else {
                tile.removeAttribute('data-state');
            }
        }

        function submitGuess() {
            if (currentLetterPosition !== COL_COUNT) {
                showMessage("Not enough letters");
                shakeRow();
                return;
            }

            const guess = grid[currentAttempt].join("").toUpperCase();

            // In a real app, you'd check against a larger dictionary here
            // if (!dictionary.includes(guess)) {
            //     showMessage("Not in word list");
            //     shakeRow();
            //     return;
            // }

            checkGuess(guess);
        }

        function checkGuess(guess) {
            const rowElements = document.getElementById(`row-${currentAttempt}`).children;
            let targetWordArr = targetWord.split("");
            let guessArr = guess.split("");
            let tileClasses = Array(COL_COUNT).fill("absent"); // Default to absent

            // First pass: Find exact matches (Green)
            for (let i = 0; i < COL_COUNT; i++) {
                if (guessArr[i] === targetWordArr[i]) {
                    tileClasses[i] = "correct";
                    targetWordArr[i] = null; // Mark as used
                    guessArr[i] = null; // Mark as handled
                }
            }

            // Second pass: Find present letters (Yellow)
            for (let i = 0; i < COL_COUNT; i++) {
                if (guessArr[i] !== null && targetWordArr.includes(guessArr[i])) {
                    tileClasses[i] = "present";
                    // Mark first occurrence as used to handle duplicates correctly
                    targetWordArr[targetWordArr.indexOf(guessArr[i])] = null;
                }
            }

            // Apply classes to UI with a slight delay for animation effect
            for (let i = 0; i < COL_COUNT; i++) {
                setTimeout(() => {
                    const tile = rowElements[i];
                    const state = tileClasses[i];
                    tile.classList.add(state);
                    tile.removeAttribute('data-state'); // Remove typing border

                    // Update keyboard color
                    updateKeyboardColor(guess[i].toLowerCase(), state);
                }, i * 200); // Staggered animation
            }

            // Check win/loss condition after animation finishes
            setTimeout(() => {
                if (guess === targetWord) {
                    showMessage(getPraise(currentAttempt));
                    gameOver = true;
                    setTimeout(showStats, 2000);
                } else {
                    currentAttempt++;
                    currentLetterPosition = 0;

                    if (currentAttempt >= ROW_COUNT) {
                        showMessage(targetWord, false);
                        gameOver = true;
                        setTimeout(showStats, 2000);
                    }
                }
            }, COL_COUNT * 200);
        }

        function updateKeyboardColor(letter, state) {
            const keyElement = document.querySelector(`.key[data-key="${letter}"]`);
            if (!keyElement) return;

            // Only upgrade state (e.g., absent -> present -> correct), don't downgrade
            if (state === 'correct') {
                keyElement.classList.remove('present', 'absent');
                keyElement.classList.add('correct');
            } else if (state === 'present' && !keyElement.classList.contains('correct')) {
                keyElement.classList.remove('absent');
                keyElement.classList.add('present');
            } else if (state === 'absent' && !keyElement.classList.contains('correct') && !keyElement.classList.contains('present')) {
                keyElement.classList.add('absent');
            }
        }

        function showMessage(msg, fade = true) {
            const el = document.createElement('div');
            el.className = 'message';
            el.textContent = msg;
            messageContainer.appendChild(el);

            if (fade) {
                setTimeout(() => {
                    el.classList.add('fade-out');
                    setTimeout(() => {
                        messageContainer.removeChild(el);
                    }, 500); // matches css transition
                }, 1500);
            }
        }

        function getPraise(attempt) {
            const praises = ["Genius", "Magnificent", "Impressive", "Splendid", "Great", "Phew"];
            return praises[attempt] || "Good";
        }

        function shakeRow() {
            const row = document.getElementById(`row-${currentAttempt}`);
            row.style.animation = "shake 0.5s";
            setTimeout(() => {
                row.style.animation = "";
            }, 500);
        }

        // Add shake animation style dynamically
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                10%, 90% { transform: translateX(-1px); }
                20%, 80% { transform: translateX(2px); }
                30%, 50%, 70% { transform: translateX(-4px); }
                40%, 60% { transform: translateX(4px); }
            }
        `;
        document.head.appendChild(style);

        function showStats() {
            const titleElement = document.getElementById('modal-title');
            const messageElement = document.getElementById('modal-message');

            if (grid[currentAttempt - 1 > 0 ? currentAttempt - 1 : 0].join("").toUpperCase() === targetWord || (currentAttempt < ROW_COUNT && gameOver)) {
                titleElement.textContent = "You Won!";
                messageElement.textContent = `You guessed the word in ${currentAttempt + (currentAttempt === ROW_COUNT ? 0 : 1)} attempts.`;
            } else {
                titleElement.textContent = "Game Over";
                messageElement.textContent = `The word was ${targetWord}.`;
            }

            modal.style.display = 'flex';
        }

        // On-screen keyboard event listeners
        document.querySelectorAll('.key').forEach(button => {
            button.addEventListener('click', (e) => {
                // Ensure we get the button element even if the SVG inside was clicked
                const keyEl = e.target.closest('.key');
                if (keyEl) {
                    const key = keyEl.getAttribute('data-key');
                    handleKeyClick(key);
                }
            });
        });

        // Physical keyboard event listeners
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            const key = e.key.toLowerCase();
            if (key === 'enter' || key === 'backspace' || /^[a-z]$/.test(key)) {
                handleKeyClick(key);
            }
        });

        // Initialize game on load
        window.onload = initGame;
    </script>
</body>

</html>
